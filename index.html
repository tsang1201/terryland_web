<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>馮問大陸 — 凡人修仙之路</title>
  <meta name="description" content="TerryLand 修仙 Bot 官方網站：境界突破、功法法寶、奇遇抽獎、靈寵養成、主線冒險全攻略。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="title-jp">孤道常放蒿里曲 · 修仙不問來時路</div>

    <div class="subtitle">TERRYLAND 凡人修仙筆記</div>

  <nav id="nav"></nav>

  <canvas id="fx"></canvas>
